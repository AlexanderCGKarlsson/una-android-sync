org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Disabled while Kotlin 2.3.10 is affected by CVE-2026-53914 in build-cache
# metadata deserialization. This plugin is build-time only and does not ship in
# the library runtime.
org.gradle.caching=false
# AGP resolves the platform-specific aapt2 binary through a detached configuration.
# With strict dependency verification, Gradle 8.13 attempts to serialize that late
# resolution into the configuration cache before its generated checksum is available.
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
