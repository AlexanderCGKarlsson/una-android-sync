name: Verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests
        run: ./gradlew clean test assembleRelease
      - name: Build runtime dependency manifest
        run: ./scripts/create-runtime-osv-manifest.sh runtime-osv-lock.json
      - name: Runtime vulnerability gate
        uses: google/osv-scanner-action/osv-scanner-action@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # v2.5.0
        with:
          scan-args: |-
            scan
            source
            --no-resolve
            --lockfile=osv-scanner:runtime-osv-lock.json
