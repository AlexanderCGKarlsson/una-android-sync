name: Verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests
        run: ./gradlew clean test assembleRelease
      - name: Build runtime dependency manifest
        run: ./scripts/create-runtime-osv-manifest.sh runtime-osv-lock.json
      - name: Runtime vulnerability gate
        uses: google/osv-scanner-action/osv-scanner-action@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
        with:
          scan-args: |-
            scan
            source
            --no-resolve
            --lockfile=osv-scanner:runtime-osv-lock.json
