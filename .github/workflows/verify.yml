name: Verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests
        run: ./gradlew clean test assembleRelease
      - name: Build runtime dependency manifest
        run: ./scripts/create-runtime-osv-manifest.sh runtime-osv-lock.json
      - name: Runtime vulnerability gate
        uses: google/osv-scanner-action/osv-scanner-action@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
        with:
          scan-args: |-
            scan
            source
            --no-resolve
            --lockfile=osv-scanner:runtime-osv-lock.json
